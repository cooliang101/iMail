[workspace]
members = [
  "http-service",
  "src-tauri",
  "crates/imail-protocol",
  "crates/imail-attachment",
  "crates/imail-core",
  "crates/imail-http",
  "crates/imail-mail",
  "crates/imail-mail-network",
  "crates/imail-oauth",
  "crates/imail-oauth-http",
  "crates/imail-runtime",
  "crates/imail-security",
  "crates/imail-storage-sqlite",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.77.2"
license = ""

[workspace.dependencies]
aes-gcm = "0.10"
axum = { version = "=0.7.5", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22"
base64ct = "=1.6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
hashify = "=0.2.6"
icu_collator = "1.5"
icu_locid = "1.5"
mail-parser = "=0.10.2"
psl = "=2.1.219"
regex = "1.11.1"
url = "=2.5.2"
async-imap = { version = "=0.11.3", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3.30"
mail-builder = { version = "=0.3.2", default-features = false }
mail-send = { version = "=0.4.9", default-features = false, features = ["builder", "ring", "tls12"] }
litemap = "=0.7.4"
rustls = { version = "=0.23.10", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "=1.7.0"
rustls-native-certs = "=0.7.3"
tokio = { version = "=1.38.2", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.0", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "=0.21.0"
tokio-socks = "=0.5.2"
jsonwebtoken = { version = "=9.3.0", default-features = false }
ureq = { version = "=2.10.1", default-features = false, features = ["json", "tls"] }
webpki-roots = "=0.26.3"
rand = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
scrypt = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
sysinfo = { version = "=0.30.13", default-features = false }
thiserror = "1.0"
tower = { version = "=0.4.13", features = ["util"] }
uuid = { version = "=1.10.0", features = ["v4"] }
zeroize = { version = "=1.8.1", features = ["derive"] }
zeroize_derive = "=1.4.2"
infer = "=0.19.0"
imagesize = "=0.13.0"
encoding_rs = "=0.8.35"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
