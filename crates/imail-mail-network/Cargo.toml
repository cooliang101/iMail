[package]
name = "imail-mail-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
acceptance-oauth = [
  "dep:imail-oauth",
  "dep:imail-oauth-http",
  "dep:imail-security",
]

[[bin]]
name = "imail-mail-acceptance"
path = "src/bin/imail-mail-acceptance.rs"
required-features = ["acceptance-oauth"]

[dependencies]
async-imap.workspace = true
base64.workspace = true
futures-util.workspace = true
imail-mail = { path = "../imail-mail" }
imail-oauth = { path = "../imail-oauth", optional = true }
imail-oauth-http = { path = "../imail-oauth-http", optional = true }
imail-protocol = { path = "../imail-protocol" }
imail-security = { path = "../imail-security", optional = true }
mail-builder.workspace = true
mail-parser.workspace = true
mail-send.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-socks.workspace = true
webpki-roots.workspace = true
serde_json.workspace = true

[dev-dependencies]
rcgen = "=0.12.1"
time = "=0.3.36"
