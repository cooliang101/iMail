name: Build Windows or publish Docker

on:
  workflow_dispatch:
    inputs:
      target:
        description: 选择本次云端构建目标
        required: true
        default: docker
        type: choice
        options:
          - docker
          - windows
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: internal-build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  publish:
    name: Verify and publish GHCR linux/amd64
    if: github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.target == 'docker')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./frontend/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "标签 ${GITHUB_REF_NAME} 与应用版本 ${version} 不一致" >&2
            exit 1
          fi
      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Generate Docker tags and labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Validate Rust Docker image before publishing it
        run: node scripts/smoke-rust-container.mjs --build-engine buildx
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./http-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    name: Build Windows x64 internal installer
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'windows'
    runs-on: windows-latest
    env:
      GOOGLE_OAUTH_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_DESKTOP_CLIENT_ID }}
      GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET }}
      MICROSOFT_OAUTH_DESKTOP_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_DESKTOP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci --prefix frontend
      - run: cargo test -p imail --lib --target x86_64-pc-windows-msvc
      - run: npm --prefix frontend run build:desktop:internal
      - run: npm --prefix frontend run test:windows-installer
      - run: npm --prefix frontend run test:desktop-release
      - uses: actions/upload-artifact@v4
        with:
          name: imail-windows-x64-internal-test
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
