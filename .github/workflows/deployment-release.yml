name: Deployment release verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deployment-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-remote:
    name: Quality and remote runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build:remote
      - run: npm run test:remote-release

  container:
    name: Remote container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:container-release

  windows:
    name: Windows installer and user daemon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc
      - run: cargo test --manifest-path src-tauri/cleanup-helper/Cargo.toml --locked
      - run: npm run build:desktop:windows
      - run: npm run test:windows-installer
      - run: npm run test:desktop-release
      - run: npm run test:local-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: imail-windows-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run build:desktop:macos
      - run: npm run test:macos-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: imail-macos-${{ matrix.arch }}-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
