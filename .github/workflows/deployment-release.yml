name: Build Windows or publish Docker

on:
  workflow_dispatch:
    inputs:
      target:
        description: 选择本次云端构建目标
        required: true
        default: docker
        type: choice
        options:
          - docker
          - windows
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: internal-build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push linux/amd64
    if: github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.target == 'docker')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./frontend/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "标签 ${GITHUB_REF_NAME} 与应用版本 ${version} 不一致" >&2
            exit 1
          fi
      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Generate Docker tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate Rust Docker image before publishing it
        run: npm --prefix frontend run test:rust-container
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build and push Docker image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    name: Build Windows x64 internal installer
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --prefix frontend
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc
      - run: npm --prefix frontend run build:desktop:internal
      - run: npm --prefix frontend run test:windows-installer
      - run: npm --prefix frontend run test:desktop-release
      - uses: actions/upload-artifact@v4
        with:
          name: imail-windows-x64-internal-test
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
