[package]
name = "imail"
version = "0.0.1"
description = "Local-first multi-account mail client and developer gateway"
authors = ["iMail contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "imail_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "stream"] }
reqwest_cookie_store = "0.9"
cookie_store = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "rt"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
