[package]
name = "imail"
version = "0.1.18"
description = "Local-first multi-account mail client and developer gateway"
authors = ["iMail contributors"]
license.workspace = true
repository = ""
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
# Source-only compatibility for auditing the retired daemon administration UI.
# Release builds do not enable it; one-release switch rollback and uninstall
# cleanup remain available independently.
legacy-daemon-admin = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "imail_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
regex = "1"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2.9.0"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
notify-rust = "4.18.0"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "stream"] }
reqwest_cookie_store = "0.9"
cookie_store = "0.22"
chrono = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
axum = { version = "=0.7.5", default-features = false }
tower = { version = "=0.4.13", features = ["util"] }
imail-http = { path = "../crates/imail-http" }
imail-core = { path = "../crates/imail-core" }
imail-oauth = { path = "../crates/imail-oauth" }
imail-protocol = { path = "../crates/imail-protocol" }
imail-security = { path = "../crates/imail-security" }
imail-storage-sqlite = { path = "../crates/imail-storage-sqlite" }
uuid = { version = "1", features = ["v4"] }
url = "=2.5.2"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
rusqlite = { workspace = true }
